name: Release Mac app

# Builds, signs, notarizes and publishes things3pp.app as a DMG on GitHub Releases.
# Run it from the Actions tab (or push a tag mac-v<version>). Needs these repository secrets:
#   MAC_CERT_P12_BASE64   Developer ID Application certificate + key, exported as .p12, base64-encoded
#   MAC_CERT_PASSWORD     password of that .p12
#   MAC_SIGN_IDENTITY     e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool (app-specific password)
# One-time setup: docs/release-setup.md.

on:
  workflow_dispatch:
  push:
    tags: ["mac-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check signing secrets
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
        run: |
          if [ -z "$P12" ]; then
            echo "::error::Signing secrets aren't set. See docs/release-setup.md (Mac app)."
            exit 1
          fi
      - name: Import signing certificate
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: xcrun notarytool store-credentials things3pp --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Build, sign, notarize
        env:
          SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          NOTARY_PROFILE: things3pp
        run: packages/mac/scripts/build-app.sh --dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          DMG="packages/mac/dist/things3pp-$VERSION.dmg"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
          gh release create "mac-v$VERSION" "$DMG" "$DMG.sha256" --title "things3pp for Mac $VERSION" --notes "Notarized build of the things3pp menu-bar app." || \
            gh release upload "mac-v$VERSION" "$DMG" "$DMG.sha256" --clobber
